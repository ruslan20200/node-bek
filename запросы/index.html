<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Запросы</title>
</head>
<body>
    <h2>Проверка запросов</h2>

    <label for="userId">ID:</label>
    <input id="userId" type="number" value="1">
    <br><br>

    <label for="userName">Имя:</label>
    <input id="userName" type="text" value="Анна">
    <br><br>

    <button onclick="sendRequest('GET')">GET</button>
    <button onclick="sendRequest('GET', true)">GET по ID</button>
    <button onclick="sendRequest('POST')">POST</button>
    <button onclick="sendRequest('PUT')">PUT</button>
    <button onclick="sendRequest('PATCH')">PATCH</button>
    <button onclick="sendRequest('DELETE')">DELETE</button>

    <p id="request">Запрос:</p>
    <p id="status" aria-live="polite">Статус:</p>
    <pre id="result"></pre>

    <script>
        async function sendRequest(method, byId = false) {
            const id = document.getElementById("userId").value;
            const name = document.getElementById("userName").value;
            let url = "/users";

            if (byId || method === "PUT" || method === "PATCH" || method === "DELETE") {
                url += "/" + encodeURIComponent(id);
            }

            const options = { method: method };
            if (method === "POST" || method === "PUT" || method === "PATCH") {
                options.headers = { "Content-Type": "application/json" };
                options.body = JSON.stringify({ name: name });
            }

            document.getElementById("request").textContent = "Запрос: " + method + " " + url;
            document.getElementById("status").textContent = "Статус: отправка...";
            document.getElementById("result").textContent = "";

            try {
                const response = await fetch(url, options);
                const data = await response.json();
                document.getElementById("status").textContent = "Статус: " + response.status;
                document.getElementById("result").textContent = JSON.stringify(data, null, 2);

                if (method === "POST" && response.ok) {
                    document.getElementById("userId").value = data.id;
                }
            } catch (error) {
                document.getElementById("status").textContent = "Ошибка соединения";
                document.getElementById("result").textContent = "Проверь, запущен ли сервер.";
            }
        }
    </script>
</body>
</html>
